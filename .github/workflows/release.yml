name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # GitHub build attestation (actions/attest-build-provenance)
  attestations: write   # store provenance attestations for both bundles

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libsdl3-dev libsdl3-image-dev \
            libfreetype-dev libpng-dev libgl-dev \
            libasound2-dev libarchive-dev libbz2-dev zlib1g-dev \
            libspeexdsp-dev libgtest-dev libgmock-dev \
            libopusfile-dev libasio-dev \
            python3 \
            xvfb x11-utils \
            curl

      - name: Build dosbox-mcp (Rust)
        run: |
          cd tools/dosbox-mcp
          cargo build --release

      - name: Build dosbox-automation (CMake)
        run: |
          cmake --preset release-linux -DOPT_FETCH_DEPS=ON
          cmake --build --preset release-linux

      - name: Stage self-contained bundle
        run: |
          mkdir -p dosbox-full-auto-linux-x86_64/_deps/iir1-build
          cp tools/dosbox-mcp/target/release/dosbox-mcp dosbox-full-auto-linux-x86_64/dosbox-mcp
          cp build/release-linux/dosbox-automation dosbox-full-auto-linux-x86_64/dosbox-automation
          cp -a build/release-linux/resources dosbox-full-auto-linux-x86_64/resources
          cp -a build/release-linux/_deps/iir1-build/libiir.so* dosbox-full-auto-linux-x86_64/_deps/iir1-build/
          tar -czf dosbox-full-auto-linux-x86_64.tar.gz dosbox-full-auto-linux-x86_64
          echo "--- bundle contents ---"
          ls -la dosbox-full-auto-linux-x86_64/ dosbox-full-auto-linux-x86_64/_deps/iir1-build/
          tar -tzf dosbox-full-auto-linux-x86_64.tar.gz | head -20

      - name: Attest bundle (GitHub build attestation, bound to this run + commit)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dosbox-full-auto-linux-x86_64.tar.gz
          subject-name: dosbox-full-auto-linux-x86_64.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dosbox-full-auto-linux-x86_64.tar.gz

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:/vcpkg" >> $env:GITHUB_ENV

      - name: Build dosbox-mcp (Rust)
        run: |
          cd tools/dosbox-mcp
          cargo build --release
          Copy-Item target/release/dosbox-mcp.exe ../../dosbox-mcp-windows-x86_64.exe

      - name: Build dosbox-automation (CMake)
        shell: pwsh
        run: |
          cmake --preset release-windows-vs2022
          cmake --build --preset release-windows-vs2022 --config Release
          Copy-Item build/release-windows-vs2022/Release/dosbox-automation.exe ../dosbox-automation-windows-x86_64.exe

      - name: Verify Windows build outputs
        shell: pwsh
        run: |
          if (-not (Test-Path ../dosbox-automation-windows-x86_64.exe)) { throw "dosbox-automation.exe missing" }
          if (-not (Test-Path ../../dosbox-mcp-windows-x86_64.exe)) { throw "dosbox-mcp.exe missing" }
          Get-ChildItem ../dosbox-automation-windows-x86_64.exe, ../../dosbox-mcp-windows-x86_64.exe | Select-Object Name,Length
          Get-ChildItem -Recurse build/release-windows-vs2022/_deps/iir1-build -ErrorAction SilentlyContinue | Select-Object FullName,Length
          Get-ChildItem build/release-windows-vs2022/Release/Resources -ErrorAction SilentlyContinue | Select-Object -First 5 Name

      - name: Stage self-contained bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dosbox-full-auto-windows-x86_64/_deps/iir1-build | Out-Null
          Copy-Item ../../dosbox-mcp-windows-x86_64.exe dosbox-full-auto-windows-x86_64/dosbox-mcp.exe
          Copy-Item ../dosbox-automation-windows-x86_64.exe dosbox-full-auto-windows-x86_64/dosbox-automation.exe
          Copy-Item -Recurse build/release-windows-vs2022/Release/Resources dosbox-full-auto-windows-x86_64/Resources
          $iirDlls = Get-ChildItem -Recurse build/release-windows-vs2022/_deps/iir1-build -Filter *.dll -ErrorAction SilentlyContinue
          if ($iirDlls) { $iirDlls | Copy-Item -Destination dosbox-full-auto-windows-x86_64/_deps/iir1-build/ }
          tar -czf dosbox-full-auto-windows-x86_64.tar.gz dosbox-full-auto-windows-x86_64
          Write-Host "--- bundle contents ---"
          Get-ChildItem -Recurse dosbox-full-auto-windows-x86_64 | Select-Object FullName,Length
          tar -tzf dosbox-full-auto-windows-x86_64.tar.gz | Select-Object -First 20

      - name: Attest bundle (GitHub build attestation, bound to this run + commit)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dosbox-full-auto-windows-x86_64.tar.gz
          subject-name: dosbox-full-auto-windows-x86_64.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dosbox-full-auto-windows-x86_64.tar.gz

  build-macos-x86_64:
    name: macOS x86_64
    runs-on: macos-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config sdl2 sdl2_net opus fluidsynth libpng libarchive vcpkg || true

      - name: Build dosbox-mcp (Rust)
        run: |
          cd tools/dosbox-mcp
          cargo build --release
          cp target/release/dosbox-mcp ../../dosbox-mcp-macos-x86_64

      - name: Build dosbox-automation (CMake)
        run: |
          cmake --preset release-macos-homebrew -DOPT_FETCH_DEPS=ON
          cmake --build --preset release-macos-homebrew
          cp build/release-macos-homebrew/dosbox-automation ../dosbox-automation-macos-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            dosbox-mcp-macos-x86_64
            dosbox-automation-macos-x86_64

  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config sdl2 sdl2_net opus fluidsynth libpng libarchive vcpkg || true

      - name: Build dosbox-mcp (Rust)
        run: |
          cd tools/dosbox-mcp
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/dosbox-mcp ../../dosbox-mcp-macos-arm64

      - name: Build dosbox-automation (CMake)
        run: |
          cmake --preset release-macos-homebrew -DOPT_FETCH_DEPS=ON
          cmake --build --preset release-macos-homebrew
          cp build/release-macos-homebrew/dosbox-automation ../dosbox-automation-macos-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dosbox-mcp-macos-arm64
            dosbox-automation-macos-arm64

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x86_64/dosbox-full-auto-linux-x86_64.tar.gz
            artifacts/windows-x86_64/dosbox-full-auto-windows-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}